<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menu · Makan Liao?</title>
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./css/stall-menu.css" />
  </head>
  <body>
    <!-- Customer-facing menu of one stall: /stall.html?vendorId=1 -->
    <header class="sm-header">
      <div class="sm-header__inner">
        <img
          class="sm-header__logo"
          src="./images/brand/makan-liao-logo.png"
          alt="Makan Liao?"
          width="118"
          height="44"
        />
      </div>
    </header>

    <main class="sm-main" id="main">
      <div id="stallPanel" hidden>
        <div class="sm-banner" id="banner" data-has-image="false">
          <img id="bannerImg" class="sm-banner__img" alt="" hidden />
        </div>

        <section class="sm-stall" aria-labelledby="stallName">
          <span class="sm-stall__logo">
            <img id="stallLogo" class="sm-stall__logo-img" alt="" hidden />
            <span id="stallLogoFallback" class="sm-stall__logo-fallback" aria-hidden="true"></span>
          </span>
          <div class="sm-stall__text">
            <h1 class="sm-stall__name" id="stallName"></h1>
            <p class="sm-stall__status" id="stallStatus" data-open="false"></p>
          </div>
        </section>

        <h2 class="ml-visually-hidden" id="menuHeading">Menu</h2>
        <ul class="sm-grid" id="menuGrid" aria-labelledby="menuHeading"></ul>
        <p class="sm-empty" id="menuEmpty" hidden>This stall hasn't added any items yet.</p>
        <p class="sm-updated" id="updatedNote" aria-live="polite"></p>
      </div>

      <section class="sm-message" id="messagePanel" hidden>
        <h1 id="messageHeading">Stall not found</h1>
        <p id="messageText">Check the link and try again.</p>
      </section>
    </main>

    <template id="menuItemTemplate">
      <li class="sm-card">
        <div class="sm-card__photo">
          <img class="sm-card__img" alt="" hidden />
          <span class="sm-card__initial" aria-hidden="true"></span>
          <span class="sm-card__badge" data-role="badge" hidden></span>
        </div>
        <div class="sm-card__body">
          <h3 class="sm-card__name"></h3>
          <p class="sm-card__desc"></p>
          <div class="sm-card__foot">
            <span class="sm-card__price"></span>
            <span class="sm-card__stock" data-role="stock"></span>
          </div>
        </div>
      </li>
    </template>

    <script src="./js/stall-menu.js" type="text/javascript"></script>
  </body>
</html>
