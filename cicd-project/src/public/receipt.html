<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Receipt</title>
</head>
<body>
    <h1>Order Receipt</h1>

    <p>Collection Reference: <span id="collection-reference">-</span></p>

    <img id="qr-code" alt="Collection QR Code" />

    <p id="collection-reference-fallback"></p>

    <hr />

    <p>Paste the order creation API response below to preview the receipt:</p>
    <textarea id="order-response" rows="8" cols="60"></textarea>
    <br />
    <button id="render-receipt">Render Receipt</button>

    <script src="./receipt.js"></script>
</body>
</html>
